<svg
  viewBox="0 0 420 160"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  className="w-full h-full"
>
  <defs>
    {/* Хромований платиново-титановий градієнт літер */}
    <linearGradient id="titaniumLetterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="25%" stopColor="#E2E8F0" />
      <stop offset="48%" stopColor="#94A3B8" />
      <stop offset="52%" stopColor="#475569" />
      <stop offset="75%" stopColor="#CBD5E1" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>

    {/* Градієнт фаски (Bevel Highlight) */}
    <linearGradient id="bevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.9" />
      <stop offset="40%" stopColor="#CBD5E1" stopOpacity="0.6" />
      <stop offset="70%" stopColor="#1E293B" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.9" />
    </linearGradient>

    {/* Градієнт для нижньої вигнутої дуги */}
    <linearGradient id="swooshGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0" />
      <stop offset="15%" stopColor="#FFFFFF" />
      <stop offset="40%" stopColor="#E2E8F0" />
      <stop offset="50%" stopColor="#CBD5E1" />
      <stop offset="60%" stopColor="#94A3B8" />
      <stop offset="85%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.1" />
    </linearGradient>

    {/* Градієнт для підзаголовка TITANIUM */}
    <linearGradient id="titaniumSubGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#94A3B8" />
      <stop offset="30%" stopColor="#E2E8F0" />
      <stop offset="50%" stopColor="#FFFFFF" />
      <stop offset="70%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>

    {/* М'яке діамантове сяйво зірок */}
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    {/* Металеве об'ємне світіння літер */}
    <filter id="metalDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  {/* ========================================================================= */}
  {/* 1. ГОЛОВНИЙ НАПИС YANTI З МЕТАЛЕВИМИ СЕРІФАМИ ТА ОБ'ЄМОМ */}
  {/* ========================================================================= */}
  <g filter="url(#metalDropShadow)">
    
    {/* ЛІТЕРА Y */}
    <path
      d="M 52 35 L 70 35 L 85 64 L 100 35 L 118 35 L 94 77 L 94 98 L 76 98 L 76 77 Z"
      fill="url(#titaniumLetterGrad)"
      stroke="url(#bevelLight)"
      strokeWidth="1.2"
      strokeLinejoin="round"
    />

    {/* ЛІТЕРА A */}
    <path
      d="M 125 98 L 149 35 L 169 35 L 193 98 L 175 98 L 169 82 L 148 82 L 142 98 Z M 153 69 L 165 69 L 159 52 Z"
      fill="url(#titaniumLetterGrad)"
      stroke="url(#bevelLight)"
      strokeWidth="1.2"
      strokeLinejoin="round"
    />

    {/* ЛІТЕРА N */}
    <path
      d="M 203 35 L 221 35 L 247 75 L 247 35 L 264 35 L 264 98 L 246 98 L 220 57 L 220 98 L 203 98 Z"
      fill="url(#titaniumLetterGrad)"
      stroke="url(#bevelLight)"
      strokeWidth="1.2"
      strokeLinejoin="round"
    />

    {/* ЛІТЕРА T */}
    <path
      d="M 270 35 L 324 35 L 324 49 L 306 49 L 306 98 L 288 98 L 288 49 L 270 49 Z"
      fill="url(#titaniumLetterGrad)"
      stroke="url(#bevelLight)"
      strokeWidth="1.2"
      strokeLinejoin="round"
    />

    {/* ЛІТЕРА I */}
    <path
      d="M 330 35 L 358 35 L 358 46 L 349 46 L 349 87 L 358 87 L 358 98 L 330 98 L 330 87 L 339 87 L 339 46 L 330 46 Z"
      fill="url(#titaniumLetterGrad)"
      stroke="url(#bevelLight)"
      strokeWidth="1.2"
      strokeLinejoin="round"
    />
  </g>

  {/* ========================================================================= */}
  {/* 2. ДІАМАНТОВА ЗІРКА-ІСКРА НА ПРАВІЙ ВЕРШИНІ ЛІТЕРИ I */}
  {/* ========================================================================= */}
  <g transform="translate(356, 32)" filter="url(#starGlow)">
    {/* Головні вертикальний та горизонтальний промені */}
    <path
      d="M 0 -13 Q 1.8 -3 13 0 Q 1.8 3 0 13 Q -1.8 3 -13 0 Q -1.8 -3 0 -13 Z"
      fill="#FFFFFF"
    />
    {/* Діагональні промені */}
    <path
      d="M 0 -7 Q 1.2 -1.5 7 0 Q 1.2 1.5 0 7 Q -1.2 1.5 -7 0 Q -1.2 -1.5 0 -7 Z"
      transform="rotate(45)"
      fill="#F1F5F9"
      opacity="0.85"
    />
    {/* Яскравий білий центр */}
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>

  {/* ========================================================================= */}
  {/* 3. НАПИС TITANIUM ПО ЦЕНТРУ */}
  {/* ========================================================================= */}
  <text
    x="210"
    y="118"
    textAnchor="middle"
    fontFamily="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    fontSize="13"
    fontWeight="700"
    letterSpacing="10"
    fill="url(#titaniumSubGrad)"
  >
    TITANIUM
  </text>

  {/* ========================================================================= */}
  {/* 4. ВИГНУТА МЕТАЛЕВА ДУГА (SWOOSH ARC) */}
  {/* ========================================================================= */}
  <g filter="url(#metalDropShadow)">
    {/* Головна дуга з потовщенням у центрі */}
    <path
      d="M 75 124 C 130 148, 290 148, 385 122 C 285 142, 135 142, 75 124 Z"
      fill="url(#swooshGrad)"
    />
    {/* Верхня виблискуюча лінія дуги */}
    <path
      d="M 75 124 C 140 144, 280 144, 385 122"
      stroke="#FFFFFF"
      strokeWidth="1.2"
      strokeLinecap="round"
      fill="none"
      opacity="0.85"
    />
  </g>

  {/* ========================================================================= */}
  {/* 5. ЗІРКА-ІСКРА НА ЛІВОМУ КІНЧИКУ ДУГИ */}
  {/* ========================================================================= */}
  <g transform="translate(75, 124)" filter="url(#starGlow)">
    <path
      d="M 0 -11 Q 1.5 -2.5 11 0 Q 1.5 2.5 0 11 Q -1.5 2.5 -11 0 Q -1.5 -2.5 0 -11 Z"
      fill="#FFFFFF"
    />
    <path
      d="M 0 -6 Q 1 -1.2 6 0 Q 1 1.2 0 6 Q -1 1.2 -6 0 Q -1 -1.2 0 -6 Z"
      transform="rotate(45)"
      fill="#F8FAFC"
      opacity="0.85"
    />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>
</svg>
